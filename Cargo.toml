[package]
name = "newfile"
version = "0.1.0"
edition = "2021"


[dependencies]
windows = { version = "0.48", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
configparser = "3.0"
clipboard-win = "5.0"
dunce = "1.0.2"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
strip = true
